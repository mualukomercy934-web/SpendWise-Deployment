
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Manage your money wisely</p>
    </header>

    <main>
        <section class="container">
            <h2>My Budget Tracker</h2>

            <label for="budget">Monthly Budget (KSh)</label>
            <input type="number" id="budget" placeholder="Enter your budget">

            <h3>Add Your Expenses</h3>

            <input type="number" id="expense1" placeholder="First expense">
            <input type="number" id="expense2" placeholder="Second expense">
            <input type="number" id="expense3" placeholder="Third expense">

            <button onclick="calculateBudget()">Calculate Budget</button>

            <div id="result">
                <p>Your results will appear here.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>SpendWise © 2026 | Budget Better, Live Better</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
